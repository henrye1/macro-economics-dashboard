# Render Blueprint for both services. Two services, one repository, no root
# package.json: each service runs its commands from its own root directory.
#
# Secrets are declared `sync: false`, so Render asks for each value when the
# Blueprint is first applied and nothing secret ever lives in this file.
services:
  # The Express passthrough. Public on purpose: a static site's rewrite can only
  # reach a publicly accessible URL, never a private service's internal address.
  - type: web
    name: macro-economics-api
    runtime: node
    rootDir: api
    # NODE_ENV=production below would make a plain `npm ci` skip dev
    # dependencies, and the build needs `typescript` from them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # The console's origin. The browser never calls the API cross-origin
      # (the console's /api/* rewrite proxies instead), so this is a backstop,
      # not the thing keeping other origins out.
      - key: CORS_ORIGIN
        value: https://macro-economics-console.onrender.com
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: CORE_API_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # The service role key the saved-query routes write with. Bypasses row
      # level security, so it is set here only and never in the console build.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Where invitation links return. Also add <CONSOLE_URL>/accept-invite to
      # the Supabase Auth redirect allowlist.
      - key: CONSOLE_URL
        value: https://macro-economics-console.onrender.com
      # Must match the Supabase email link expiry; display only.
      - key: INVITE_LINK_TTL_HOURS
        value: "24"

  # The Angular console.
  - type: web
    name: macro-economics-console
    runtime: static
    rootDir: ui
    # No NODE_ENV here: the build needs the Angular CLI from dev dependencies.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/ui/browser
    envVars:
      - key: NODE_VERSION
        value: "24"
    # Nothing in the console is meant to be embedded, and its sign-in screens
    # take a password, so no other site may frame it. A CSP with
    # frame-ancestors would say the same but is a separate decision: it must
    # also allow the two Google Fonts origins index.html loads from.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # Order matters: the API rewrite must win over the client-side fallback.
      # Routes cannot reference another service, so this names the API's URL as
      # text. If Render gives the API a different hostname, change it here.
      - type: rewrite
        source: /api/*
        destination: https://macro-economics-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
